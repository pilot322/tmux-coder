[worktree]
on-create-script = ".tmux-coder/tmux-coder-worktree-setup"
on-create-timeout = "5m"

[[menu-actions]]
name = "implement-issue"
description = "Implement a gh issue"
script = ".tmux-coder/actions/implement-issue"
argument="required"

[[menu-actions]]
name = "grill-issue"
description = "Grill-with-docs for a gh issue"
script = ".tmux-coder/actions/grill-issue"
argument="required"
